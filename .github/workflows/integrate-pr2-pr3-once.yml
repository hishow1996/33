name: One-time integration of PR #2 and PR #3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/integrate-pr2-pr3-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge PR #2 then PR #3, preferring current integrated code on overlapping hunks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/upgrade/dubbing-pipeline-oct-2026:refs/remotes/origin/upgrade/dubbing-pipeline-oct-2026
          git fetch origin refs/heads/feature/robust-asr-audio-segment-cache:refs/remotes/origin/feature/robust-asr-audio-segment-cache

          merge_branch() {
            local ref="$1"
            local message="$2"
            if git merge --no-ff --no-edit -X ours -m "$message" "$ref"; then
              return 0
            fi
            local conflicts
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            if [[ -z "$conflicts" ]]; then
              git merge --abort || true
              echo "Merge failed without resolvable file conflicts for $ref" >&2
              return 1
            fi
            echo "Unresolved structural conflicts; retaining the current integrated version for these files:"
            printf '%s\n' "$conflicts"
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              git checkout --ours -- "$path"
              git add -- "$path"
            done <<< "$conflicts"
            git commit -m "$message (structural conflicts kept from current integration)"
          }

          merge_branch "origin/upgrade/dubbing-pipeline-oct-2026" "Merge PR #2: dubbing pipeline, cache correctness, playback reliability"
          merge_branch "origin/feature/robust-asr-audio-segment-cache" "Merge PR #3: webpage audio extraction and synchronized Chinese subtitles"

          printf '\n# Trigger APK build after long-sentence auto-pause synchronization merged PR #2 and PR #3.\n' >> .github/workflows/build-apk.yml
          rm .github/workflows/integrate-pr2-pr3-once.yml
          git add .github/workflows/build-apk.yml .github/workflows/integrate-pr2-pr3-once.yml
          git commit -m "Trigger APK build after long-sentence auto-pause synchronization merged PR #2 and #3"

          echo "INTEGRATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Integrated commit: $(git rev-parse HEAD)"
          git log --oneline --decorate -4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 2 \
            -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar

      - name: Run JVM unit tests before publishing integration
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Push validated integration to main
        run: git push origin HEAD:refs/heads/main

      - name: Trigger official APK build for the merged main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/build-apk.yml/dispatches" \
            -d '{"ref":"main"}'
