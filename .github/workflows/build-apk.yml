name: Build Android APK

# User-requested rebuild trigger for latest main commit 3ceecff (2026-10-18).

# Explicit rebuild request after hardening subtitle-seek recovery and direct System TTS utterance lifecycle.
# Explicit rebuild request after keeping the player page visible during subtitle-seek buffering.
# Explicit retry trigger after fixing the VideoSourceKind import in subtitle processing UI.
# Explicit trigger for the user's yt-dlp local-version detection fix.
# User-requested workflow-only trigger commits are the fallback when manual dispatch is unavailable.
# Explicit rebuild trigger for making the player visible before the first progressive TTS cue.
# Re-run JVM regression checks after the safe overrun policy changed old 2x-sync expectations.
# User-requested APK build after thread-safe playbackAllowed player-state read.
# Explicit trigger for the user's request to build the latest main-branch source.
# User-requested APK build for the dedicated local application logs screen.
# User-requested APK build after enriching crash root-cause and operation-context diagnostics.
# Final trigger after adding recoverable error logging to playback, TTS, subtitles and web parsing.
# Retry trigger after correcting the TTS preview log context reference.
# User-requested rebuild after fixing TextureView parent reuse during reparse.
# Explicit retry trigger after fixing the duplicate unavailable-TTS fallback branch.
on:
  # Preferred path: run only after a manual user request.
  workflow_dispatch:
  # Connector fallback: allow a workflow-only trigger commit, never ordinary source pushes.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  # Newer commits supersede stale APK builds; don't let a slow cache-upload step block the newest fix.
  cancel-in-progress: true

jobs:
  build:
    # Run only on manual dispatch or a uniquely named, explicitly requested trigger commit.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.event.head_commit.message == 'Trigger one-time APK build requested by user' || github.event.head_commit.message == 'Trigger retry APK build after Kotlin compile fixes' || github.event.head_commit.message == 'Trigger final APK build after unit-test import fix' || github.event.head_commit.message == 'Trigger APK build after test expectations and VTT line breaks are fixed' || github.event.head_commit.message == 'Trigger APK build after subtitle import UI cleanup' || github.event.head_commit.message == 'Trigger APK build after AudioTrack static state fix' || github.event.head_commit.message == 'Trigger APK build after Google subtitle and processing-page fixes' || github.event.head_commit.message == 'Trigger APK build after automatic yt-dlp fallback ordering update' || github.event.head_commit.message == 'Trigger APK build after settings UI redesign' || github.event.head_commit.message == 'Trigger APK build after settings UI compile fix' || github.event.head_commit.message == 'Trigger APK build after restoring settings UI' || github.event.head_commit.message == 'Trigger APK build after System TTS audio-routing and workbench fixes' || github.event.head_commit.message == 'Trigger APK build after yt-dlp local version detection fix' || github.event.head_commit.message == 'Trigger APK build after SenseVoice integration' || github.event.head_commit.message == 'Trigger APK build after local ASR performance optimization' || github.event.head_commit.message == 'Trigger APK build after subtitle seeking and TTS lifecycle hardening' || github.event.head_commit.message == 'Trigger APK build after preventing subtitle seek from reopening parsing page' || github.event.head_commit.message == 'Trigger APK build after first progressive TTS cue visibility fix' || github.event.head_commit.message == 'Trigger APK build after dubbing-audible fix series' || github.event.head_commit.message == 'Trigger APK build after TextureView parent fix' || github.event.head_commit.message == 'Trigger APK build after application logs screen' || github.event.head_commit.message == 'Trigger APK build after application log error coverage' || github.event.head_commit.message == 'Trigger APK rebuild after TTS preview log scope fix' || github.event.head_commit.message == 'Trigger APK build after detailed diagnostic context' || startsWith(github.event.head_commit.message, 'Trigger APK build after overrun-safe dubbing synchronization')))
    name: Build installable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Install SDK packages in a separate shell step so each package is a distinct sdkmanager argument.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # This is the final integration build. Run unit tests before creating installable APK artifacts.
      # Speech models are downloaded by the app on first use; do not bundle the 300MB+ ONNX models into the APK.

      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 2 \
            -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      # Debug APKs are signed with Android's debug key and can be installed directly.
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elephant-translate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: elephant-translate-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
